name: Deploy to GitHub Pages

# Builds from the `dev` branch (sole source branch) and publishes Vite dist/
# to the orphan `gh-pages` branch (static site only).
# Repo Settings → Pages → Source: Deploy from a branch → gh-pages / (root).

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node ^20.19 || >=22.12
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check (audit imports + smoke)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
